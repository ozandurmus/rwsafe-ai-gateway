    apiHosts: [api.githubcopilot.com, copilot-proxy.githubusercontent.com]
    loginHosts: []
  - platform: github
    hostSuffixes: [github.com]
    apiHosts: [api.github.com]
    loginHosts: []
  - platform: openai
    hostSuffixes: [chatgpt.com, openai.com]
    apiHosts: [api.openai.com]
    loginHosts: [auth.openai.com]
  - platform: devin
