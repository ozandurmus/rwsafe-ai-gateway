# rwsafe-control defaults. Runtime values come from the environment (deploy/rwsafe ConfigMaps) and secrets from mounted
# files only: `spring.config.import` reads a config tree where each file name is a property name (for example
# `spring.datasource.password`), and the rwsafe key files are paths (AGENTS.md section 8, CORPORATE_TECHNOLOGY_STACK §2).
spring:
  application:
    name: rwsafe-control
  config:
    import: "optional:configtree:${RWSAFE_SECRETS_DIR:/run/secrets/rwsafe/}"
  main:
    banner-mode: off
  datasource:
    url: ${RWSAFE_DB_URL:jdbc:postgresql://127.0.0.1:5432/rwsafe}
    username: ${RWSAFE_DB_USER}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 5000
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
    serialization:
      write-dates-as-timestamps: false
  mvc:
    throw-exception-if-no-handler-found: true

server:
  port: ${RWSAFE_HTTP_PORT:8080}
  # The client address behind the ingress, for the login throttle only (never stored). Off unless the deploy names its
  # ingress: forwarded headers are trusted only from RWSAFE_TRUSTED_PROXIES (a regular expression; matches nothing by
  # default), so a client cannot choose its own address (PR 12 review N-01).
  forward-headers-strategy: ${RWSAFE_FORWARD_HEADERS:none}
  tomcat:
    remoteip:
      internal-proxies: ${RWSAFE_TRUSTED_PROXIES:^$}
    max-swallow-size: 2MB
  address: ${RWSAFE_HTTP_BIND:127.0.0.1}
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: 30m
      cookie:
        name: ${RWSAFE_SESSION_COOKIE:__Host-rwsafe-session}
        http-only: true
        secure: ${RWSAFE_COOKIE_SECURE:true}
        same-site: strict
        path: /
      tracking-modes: cookie

rwsafe:
  capture-sink:
    port: ${RWSAFE_CAPTURE_SINK_PORT:8092}
    bind-address: ${RWSAFE_CAPTURE_SINK_BIND:127.0.0.1}
  privacy:
    hmac-key-file: ${RWSAFE_PRIVACY_HMAC_KEY_FILE:/run/secrets/rwsafe-privacy-hmac-key/key}
    estate-dictionary-file: ${RWSAFE_ESTATE_DICTIONARY_FILE:/etc/rwsafe/estate-dictionary.txt}
  identity:
    cookie-secure: ${RWSAFE_COOKIE_SECURE:true}
    break-glass:
      enabled: ${RWSAFE_BREAK_GLASS_ENABLED:false}
      initial-password-file: ${RWSAFE_BREAK_GLASS_PASSWORD_FILE:/var/lib/rwsafe/break-glass-initial-password}
    ldap:
      url: ${RWSAFE_LDAP_URL:}
      bind-dn: ${RWSAFE_LDAP_BIND_DN:}
      bind-password-file: ${RWSAFE_LDAP_BIND_PASSWORD_FILE:/run/secrets/rwsafe-ldap/password}
      user-search-base: ${RWSAFE_LDAP_USER_SEARCH_BASE:}
      user-search-filter: ${RWSAFE_LDAP_USER_SEARCH_FILTER:(sAMAccountName={0})}
      group-attribute: memberOf
  sample:
    events: 0
    seed: 1
