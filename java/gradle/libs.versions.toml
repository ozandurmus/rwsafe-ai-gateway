# Versions match the neXus ui2 build where both products use the same library (ADR-011: one engine, two products).
[versions]
# JUnit for the modules outside the Spring Boot platform (platform-core, detect, policy, dataplane with its Jazzer
# harness, cli). Modules on the Spring Boot BOM (persistence, control, worker, architecture-tests) resolve the JUnit 6.0.3
# it manages; moving the rest follows a Jazzer release that supports JUnit 6 (PR 12 Spring Boot 4 review M-01).
junit = "5.10.3"
archunit = "1.3.0"
re2j = "1.8"
slf4j = "2.0.18"
jazzer = "0.24.0"
netty = "4.1.139.Final"
# Control plane (ARCHITECTURE.md §3.2): the neXus ui2 versions; the Spring Boot BOM manages jOOQ, Flyway, HikariCP and
# UnboundID, and the three overrides below are the neXus security floors above the BOM's managed versions.
# Spring Boot 4.1.1 (2026-08-20) manages Spring Framework 7.0.9, the only open-source fix for CVE-2026-47884 and
# CVE-2026-47890 (spring-webmvc 6.2.x has none). The newest 4.1.x published at least two weeks earlier (4.1.2 is from
# 2026-10-22); neXus is on 4.0.8 (PO_DECISION_RECORD_2026_10_30_SPRING_BOOT_4).
springboot = "4.1.1"
# Security floor above Spring Boot 4.1.1's managed Tomcat 11.0.24 (open advisories); 11.0.27 is the neXus floor
# (2026-10-12).
tomcat = "11.0.27"
jackson = "2.21.7"
# Jackson 3 arrives with Spring Boot 4 (its unused HTTP starter) and Flyway 12. Floor above the 3.1.5 that Boot 4.1.1
# manages (HIGH advisories, fixed with 2.21.7 on 2026-09-21); 3.1.8 is newer than two weeks.
jackson3 = "3.1.7"
postgresql = "42.7.13"
# Local and CI PostgreSQL 16 without a container runtime (tests and the development runner only, never an image).
embedded-postgres = "2.2.2"
embedded-postgres-binaries = "16.15.0"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
# The only regular-expression engine allowed on the inline path (AGENTS.md section 5, SR-DP-1): linear time.
re2j = { module = "com.google.re2j:re2j", version.ref = "re2j" }
# Test fixtures only (the logging fence must see a real logging API); no production module logs yet.
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
# Coverage-guided fuzzing of the ICAP and HTTP parsers (SR-DP-4): JUnit @FuzzTest, regression corpus in src/test/resources.
jazzer-junit = { module = "com.code-intelligence:jazzer-junit", version.ref = "jazzer" }
# ICAP transport of the data plane (ARCHITECTURE.md §3.1): event loops, pooled buffers, TLS for Secure ICAP later.
netty-handler = { module = "io.netty:netty-handler", version.ref = "netty" }
# Control plane and persistence (Q-16: jOOQ and Flyway on PostgreSQL; Q-9: LDAP/AD bind first).
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springboot" }
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
jackson3-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson3" }
# Spring Boot 4 renamed spring-boot-starter-web to spring-boot-starter-webmvc.
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
# Jackson 2 for Spring MVC message conversion (Boot 4 defaults to Jackson 3); see control/build.gradle.kts.
spring-boot-jackson2 = { module = "org.springframework.boot:spring-boot-jackson2" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
tomcat-embed-core = { module = "org.apache.tomcat.embed:tomcat-embed-core", version.ref = "tomcat" }
tomcat-embed-el = { module = "org.apache.tomcat.embed:tomcat-embed-el", version.ref = "tomcat" }
tomcat-embed-websocket = { module = "org.apache.tomcat.embed:tomcat-embed-websocket", version.ref = "tomcat" }
jooq = { module = "org.jooq:jooq" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikari = { module = "com.zaxxer:HikariCP" }
unboundid-ldapsdk = { module = "com.unboundid:unboundid-ldapsdk" }
embedded-postgres = { module = "io.zonky.test:embedded-postgres", version.ref = "embedded-postgres" }
embedded-postgres-binaries-bom = { module = "io.zonky.test.postgres:embedded-postgres-binaries-bom", version.ref = "embedded-postgres-binaries" }
embedded-postgres-binaries-darwin-arm64v8 = { module = "io.zonky.test.postgres:embedded-postgres-binaries-darwin-arm64v8" }
embedded-postgres-binaries-linux-amd64 = { module = "io.zonky.test.postgres:embedded-postgres-binaries-linux-amd64" }
# Annotations on jOOQ's Settings class; compile-time only, so -Xlint:classfile finds them (no JAXB at runtime).
jakarta-xml-bind-api = { module = "jakarta.xml.bind:jakarta.xml.bind-api" }
