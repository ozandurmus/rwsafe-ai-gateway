# Versions match the neXus ui2 build where both products use the same library (ADR-011: one engine, two products).
[versions]
junit = "5.10.3"
archunit = "1.3.0"
re2j = "1.8"
slf4j = "2.0.18"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
# The only regular-expression engine allowed on the inline path (AGENTS.md section 5, SR-DP-1): linear time.
re2j = { module = "com.google.re2j:re2j", version.ref = "re2j" }
# Test fixtures only (the logging fence must see a real logging API); no production module logs yet.
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
