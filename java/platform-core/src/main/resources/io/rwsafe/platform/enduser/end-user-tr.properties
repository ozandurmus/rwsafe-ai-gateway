# End-user texts, Turkish (AGENTS.md section 3: KVKK article 10 notice validity). The product's copy of the catalogue
# under docs/i18n/tr; EndUserCatalogueDocsTest proves the two say the same. Read as UTF-8 by EndUserCatalogue, which
# refuses a missing or extra key, an empty text or a placeholder outside the key's declared set.
#
# Placeholders are {{name}}. Values configured at runtime (never committed): controller_name, dpo_contact, policy_link,
# retention_metadata, retention_redacted. Values the product fills: class, reason, platform, ref,
# notice_version. Every inserted value and every text is HTML-escaped when rendered.
#
# Rule PC-1: a change to any notice text or to a configured value changes the notice version (catalogue.version plus a
# digest of the rendered notice), so every user acknowledges again. Bump catalogue.version for every text change.
#
# Legal review: the Product Owner approved these texts on 2026-10-31
# (docs/design/PO_DECISION_RECORD_2026_10_31_END_USER_NOTICE_LEGAL_REVIEW.md); docs/i18n/README.md lists the decisions.

catalogue.version=tr-3

# ---- shared page parts ----
page.reference=Yardım isterseniz bu referansı bildirin: {{ref}}
page.policy=Kurumsal yapay zeka kullanım politikası: {{policy_link}}

# ---- block page (403), one body per reason kind ----
block.title=İstek engellendi
block.class.body=Gönderdiğiniz içerikte {{class}} bulundu. Kurumsal politika gereği bu tür bilgiler {{platform}} platformuna gönderilemez.
block.class.advice=Bulunan bilginin kendisi bu sayfada gösterilmez ve kaydedilmez; yalnızca türü kaydedilir. Bu bilgiyi içerikten çıkarıp tekrar deneyebilirsiniz.
block.class.noexception=Bu tür bilgiler için istisna tanınmaz: müşteri bilgileri, gizli bilgiler, özel nitelikli kişisel veriler ve kurum içi kimlik bilgileri hiçbir yapay zeka platformuyla paylaşılamaz.
block.uninspectable.body=Gönderdiğiniz içerik güvenlik denetiminden geçirilemedi ({{reason}}). Denetlenemeyen içerik, kurumsal politika gereği {{platform}} platformuna gönderilmez.
block.uninspectable.advice=İçeriği küçültüp ya da düz metin olarak yeniden göndermeyi deneyebilirsiniz.
block.unavailable.body=Güvenlik denetimi şu anda tamamlanamadı. Denetlenemeyen içerik, kurumsal politika gereği {{platform}} platformuna gönderilmez.
block.unavailable.advice=Lütfen birkaç dakika sonra tekrar deneyin.
block.platform.body={{platform}} platformunun bu ağda kullanılmasına izin verilmiyor.
block.platform.advice=Kurumun izin verdiği yapay zeka araçlarını kullanabilirsiniz. İzin verilen araçları kurumsal politikada bulabilirsiniz.
block.personal.title=Kurumsal hesap gerekli
block.personal.body={{platform}} platformuna kişisel bir hesapla giriş yapmaya çalıştınız. Bu ağda yapay zeka araçları yalnızca kurumsal hesapla kullanılabilir.
block.personal.advice=Lütfen kurumsal hesabınızla giriş yapın. Bu deneme kaydedildi; kişisel hesap bilginiz ve girdiğiniz içerik kaydedilmedi.
block.generic.body=İsteğiniz kurumsal politika gereği engellendi.
block.generic.advice=Bunun bir hata olduğunu düşünüyorsanız aşağıdaki referansla bilgi güvenliği ekibine başvurabilirsiniz.

# ---- short messages for API clients (IDE, command line, agents) ----
api.class=İstek, içerikte kurumsal politikanın izin vermediği bir bilgi türü bulunduğu için engellendi.
api.uninspectable=İçerik güvenlik denetiminden geçirilemediği için istek engellendi.
api.unavailable=Güvenlik denetimi tamamlanamadığı için istek engellendi; lütfen biraz sonra tekrar deneyin.
api.platform=Bu yapay zeka platformunun bu ağda kullanılmasına izin verilmiyor.
api.personal=Bu ağda yapay zeka araçları yalnızca kurumsal hesapla kullanılabilir.
api.generic=İstek kurumsal politika gereği engellendi.

# ---- coaching (WARN) page ----
coaching.title=Dikkat
coaching.body=Az önce gönderdiğiniz içerikte {{class}} olabilir. İsteğiniz iletildi; ancak bu tür bilgilerin yapay zeka platformlarıyla paylaşılması kurumsal politika gereği sınırlıdır.
coaching.advice=Bir sonraki gönderimde bu bilgiyi içerikten çıkarmanızı rica ederiz.

# ---- streamed response aborted ----
stream.terminated=Yanıt kesildi: yapay zeka platformundan gelen yanıtta {{class}} bulunduğu için güvenlik geçidi yanıtı durdurdu. Yanıtın o ana kadar gelen kısmı değiştirilmedi. Referans: {{ref}}

# ---- labels inserted as {{class}} and {{reason}} ----
class.secret=gizli bilgi (parola, anahtar ya da erişim kodu)
class.customer_data=müşteri bilgisi (kimlik numarası, banka hesap numarası ya da kart numarası)
class.special_category=özel nitelikli kişisel veri (sağlık ya da inanç bilgisi gibi)
class.internal_identity=kurum içi kimlik bilgisi
class.other=hassas bilgi
reason.size=içerik denetlenemeyecek kadar büyük
reason.findings=içerikte çok fazla hassas bilgi var
reason.encoded=içerik açılamayan sıkıştırılmış ya da kodlanmış bir biçimde
reason.format=içeriğin biçimi çözümlenemedi
reason.incomplete=içerik zamanında ya da eksiksiz alınamadı

# ---- first-use notice (aydınlatma metni) ----
notice.title=Yapay zeka araçlarının kullanımına ilişkin aydınlatma metni
notice.intro=Bu metin, 6698 sayılı Kişisel Verilerin Korunması Kanunu (bundan sonra "Kanun") uyarınca sizi bilgilendirmek için hazırlanmıştır. Veri sorumlusu: {{controller_name}}.
notice.scope.heading=Ne inceleniyor?
notice.scope.text=Kurum ağından yapay zeka asistanlarına ve kodlama araçlarına gönderdiğiniz istekler ve aldığınız yanıtlar bir güvenlik geçidinden geçer ve otomatik olarak incelenir. Bunun için ayrıca bir şey yapmanız gerekmez.
notice.data.heading=Hangi bilgiler işleniyor?
notice.data.text=Hangi yapay zeka platformunu, hangi araçla, hangi kurumsal hesapla ve ne zaman kullandığınız; güvenlik kurallarının verdiği karar; gönderdiğiniz ve aldığınız içeriğin kişisel veriler ve gizli bilgiler çıkarılmış (maskelenmiş) hâli. Bulunan hassas bilginin kendisi kaydedilmez, yalnızca türü kaydedilir.
notice.purpose.heading=Neden?
notice.purpose.text=Müşteri sırlarının, kişisel verilerin ve gizli bilgilerin (parola, anahtar gibi) kurum dışına çıkmasını önlemek; yapay zeka araçlarının yalnızca kurumsal hesapla kullanılmasını sağlamak; güvenlik olaylarını incelemek.
notice.basis.heading=Hukuki sebep
notice.basis.text=Kullanım kayıtları ve güvenlik kararları, kurumun bilgi sistemleri güvenliğine ilişkin hukuki yükümlülüğü nedeniyle (Kanun'un 5. maddesinin 2. fıkrasının (ç) bendi); maskelenmiş içerik, kurumun meşru menfaati nedeniyle (Kanun'un 5. maddesinin 2. fıkrasının (f) bendi) işlenir. Bu işleme açık rızanıza dayanmaz; bu nedenle sizden rıza istenmez.
notice.transfer.heading=Kimlere aktarılıyor?
notice.transfer.text=Kullandığınız yapay zeka platformunun sağlayıcısına yalnızca kurumsal politikanın izin verdiği içerik iletilir. Bu sağlayıcılar yurt dışında bulunabilir; aktarım yalnızca Kanun'un 9. maddesine uygun aktarım dayanağı kurum tarafından kayda geçirilmiş sağlayıcılara yapılır. Kullanım kayıtları ve güvenlik kararları kurumun güvenlik izleme sistemine aktarılır; içerik bu sisteme aktarılmaz.
notice.retention.heading=Ne kadar saklanıyor?
notice.retention.text=Kullanım kayıtları ve güvenlik kararları {{retention_metadata}} gün, maskelenmiş içerik {{retention_redacted}} gün saklanır. Süresi dolan bilgiler silinir ve silme işlemi kayıt altına alınır.
notice.rights.heading=Haklarınız
notice.rights.text=Kanun'un 11. maddesindeki haklarınız için (bilgilerinize erişmek, düzeltilmesini ya da silinmesini istemek, itiraz etmek gibi) {{dpo_contact}} adresine başvurabilirsiniz.
notice.personal.heading=Kişisel hesaplar
notice.personal.text=Kurum ağında yapay zeka araçlarına kişisel hesapla giriş engellenir. Engellenen denemenin yalnızca kendisi kaydedilir; kişisel hesap bilginiz ve içerik kaydedilmez.
notice.acknowledge.text=Devam ettiğinizde bu metni okuduğunuz kaydedilir (sürüm {{notice_version}}). Bu kayıt bir onay ya da rıza değildir; yalnızca bilgilendirildiğinizi gösterir. Kurumun insan kaynakları politikası kapsamında bu sürümü okuduğunuz kayda geçtiyse o kayıt da aynı anlamı taşır.
