# Validation workflow (ROADMAP phase 0 "Repository and CI"; AGENTS.md sections 4.15, 10 and 14).
# Runs on every pull request and on main: the repository privacy gate (its self-test, the tree, and on a pull request every
# commit the pull request adds), gitleaks over the tree and the history with a planted-key self-test, the Java unit and
# ArchUnit tests with the Jazzer regression corpus and a bounded fuzzing run, the Maven-portability smoke build
# (ADR-011 §4), Trivy (filesystem, lockfiles, configuration; SR-SC-2) and Semgrep (Java) judged against
# security/baseline.yaml, the deploy manifest check (tools/deploy, AGENTS.md section 8), and the admin SPA's type check, Vitest tests and production build. Every job prints the commit it tested. No secrets, no deploy, nothing reaches HOST-A.
# Actions are pinned by commit digest; the tag in the trailing comment is for humans only.
name: validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  privacy-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Commit under test
        run: &print-commit |
          tested=$(git rev-parse HEAD)
          line="tested commit ${tested}"
          if [ -n "${PR_HEAD_SHA}" ]; then line="${line} (merge of PR head ${PR_HEAD_SHA} onto base ${PR_BASE_SHA})"; fi
          echo "${line}"
          echo "${GITHUB_JOB}: ${line}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Privacy gate self-test (planted synthetic findings must fail, SR-PRIV-13)
        run: python3 -B tools/privacy/test_repository_privacy_check.py
      - name: Repository privacy gate
        run: python3 -B tools/privacy/repository_privacy_check.py .
      # The repository is public and a pull request merges with its history: an identifier added in one commit and
      # removed in a later one would still be published, so every commit the pull request adds passes the gate too,
      # with its message, against this pull request's own allowlist (never the commit's, which could allowlist itself).
      # checkout-index writes every tracked file (git archive would honour export-ignore).
      - name: Repository privacy gate on every commit of the pull request
        if: github.event_name == 'pull_request'
        run: |
          commits=$(git rev-list --reverse "${PR_BASE_SHA}..${PR_HEAD_SHA}")
          count=$(printf '%s\n' "${commits}" | grep -c . || true)
          if [ "${count}" -lt 1 ]; then echo "no commit found between base and head: refusing to pass"; exit 1; fi
          echo "scanning ${count} commit(s)"
          status=0
          for commit in ${commits}; do
            dir="${RUNNER_TEMP}/commit-${commit}"
            mkdir -p "${dir}"
            GIT_INDEX_FILE="${RUNNER_TEMP}/index-${commit}" git read-tree "${commit}"
            GIT_INDEX_FILE="${RUNNER_TEMP}/index-${commit}" git checkout-index --all --prefix="${dir}/"
            git log -1 --format=%B "${commit}" > "${dir}/COMMIT_MESSAGE.txt"
            echo "commit ${commit}"
            python3 -B tools/privacy/repository_privacy_check.py --policy-root "${GITHUB_WORKSPACE}" "${dir}" || status=1
            rm -rf "${dir}" "${RUNNER_TEMP}/index-${commit}"
          done
          exit "${status}"

  # AGENTS.md section 8, ADR-001: the k3s overlay renders and every workload obeys the shared-host rules (priority below
  # neXus, no hostPath or privilege, non-root, read-only root, limits, digest-pinned images, sized emptyDirs, no token,
  # NetworkPolicies, quota fit, Secret contracts). The runner image's kubectl renders and decodes offline (KUBECONFIG is
  # /dev/null inside the script); nothing reaches a cluster.
  manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Commit under test
        run: *print-commit
      - name: Manifest check self-test (fixtures must pass and fail as planted)
        run: |
          kubectl version --client
          python3 -B tools/deploy/test_manifest_check.py
      - name: Manifest check on the k3s overlay
        run: python3 -B tools/deploy/manifest_check.py
      # The pilot (docs/operations/PILOT_RUNBOOK.md): its overlay under the default and another product name, the render
      # wrapper's self-test, and the pilot scripts (the runner image ships shellcheck).
      - name: Manifest check on the pilot overlay, and under another product name
        run: |
          python3 -B tools/deploy/manifest_check.py --overlay deploy/rwsafe/overlays/pilot
          python3 -B tools/deploy/manifest_check.py --overlay deploy/rwsafe/overlays/pilot --product acme
      - name: Pilot render self-test and scripts
        run: |
          python3 -B tools/pilot/test_render.py
          for f in tools/pilot/*.sh; do bash -n "$f"; done
          shellcheck -x tools/pilot/*.sh

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Commit under test
        run: *print-commit
      - name: Install gitleaks (checksum verified)
        run: |
          dir="${RUNNER_TEMP}/gitleaks"
          mkdir -p "${dir}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${dir}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${dir}/${archive}" | sha256sum --check --strict
          tar -xzf "${dir}/${archive}" -C "${dir}" gitleaks
          echo "${dir}" >> "${GITHUB_PATH}"
      # One runtime-built canary per rwsafe rule (AGENTS.md 4.5: no secret-shaped literal exists in the repository), each
      # in its own file; every file must be reported, so a deleted or broken rule fails here. Inline allow markers are
      # ignored in every gitleaks run; the privacy gate rejects them and a .gitleaksignore file outright.
      - name: gitleaks self-test (every planted synthetic key must be reported)
        run: |
          dir="${RUNNER_TEMP}/gitleaks-self-test"
          mkdir -p "${dir}"
          python3 - "${dir}" <<'PY'
          import secrets, string, sys
          from pathlib import Path
          a = string.ascii_letters + string.digits
          r = lambda n: "".join(secrets.choice(a) for _ in range(n))
          canaries = {
              "anthropic": "sk-" + "ant-" + r(40), "openai": "sk-" + "proj-" + r(40), "google": "AI" + "za" + r(35),
              "github": "gh" + "p_" + r(36), "icap": "icap" + "_secret" + ' = "' + r(24) + '"',
          }
          for name, value in canaries.items():
              Path(sys.argv[1], name + ".txt").write_text(value + "\n")
          PY
          rc=0
          gitleaks dir "${dir}" --config .gitleaks.toml --ignore-gitleaks-allow --redact --no-banner --exit-code 3 \
            --report-format json --report-path "${RUNNER_TEMP}/gitleaks-self-test.json" > /dev/null 2>&1 || rc=$?
          rm -rf "${dir}"
          if [ "${rc}" -ne 3 ]; then echo "gitleaks self-test FAIL (exit ${rc})"; exit 1; fi
          python3 - "${RUNNER_TEMP}/gitleaks-self-test.json" <<'PY'
          import json, sys
          from pathlib import Path
          reported = {Path(f["File"]).stem for f in json.loads(Path(sys.argv[1]).read_text())}
          missing = sorted({"anthropic", "openai", "google", "github", "icap"} - reported)
          print("gitleaks self-test " + ("FAIL, not reported: " + ", ".join(missing) if missing else "PASS"))
          sys.exit(1 if missing else 0)
          PY
      - name: gitleaks on the tree
        run: gitleaks dir . --config .gitleaks.toml --ignore-gitleaks-allow --redact --no-banner --exit-code 1
      - name: gitleaks on the history
        run: gitleaks git . --config .gitleaks.toml --ignore-gitleaks-allow --redact --no-banner --exit-code 1

  java-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Commit under test
        run: *print-commit
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            java/**/*.gradle.kts
            java/**/gradle.lockfile
            java/gradle/libs.versions.toml
            java/gradle/verification-metadata.xml
            java/gradle/wrapper/gradle-wrapper.properties
      - name: Unit and architecture tests (includes the Jazzer regression corpus) and the image classpaths
        run: ./java/gradlew -p java --no-daemon --stacktrace --dependency-verification strict unitTest architectureTest \
          :dataplane:imageDist :control:imageDist
      # SR-DP-4: each @FuzzTest fuzzes for the duration it declares; a crash or timeout fails the job.
      - name: Fuzz the parsers (Jazzer fuzzing mode)
        run: ./java/gradlew -p java --no-daemon --stacktrace --dependency-verification strict fuzzTest

  # The admin SPA (ARCHITECTURE.md §3.4, AGENTS.md section 10: frontend tests and tsc before every ship). The lockfile is
  # installed exactly and without install scripts; the build proves the bundle compiles.
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Commit under test
        run: *print-commit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install from the lockfile (no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type check (tsc)
        run: npm run typecheck
      - name: Unit tests (Vitest)
        run: npm test
      - name: Production build
        run: npm run build

  maven-portability:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Commit under test
        run: *print-commit
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            java/**/*.gradle.kts
            java/**/gradle.lockfile
            java/gradle/libs.versions.toml
            java/gradle/verification-metadata.xml
            java/gradle/wrapper/gradle-wrapper.properties
      - name: Generate the Maven build from the Gradle model (ADR-011 §4)
        run: ./java/gradlew -p java --no-daemon --stacktrace --dependency-verification strict generateMavenSmokeBuild
      # The runner image's Maven; the generated poms pin every dependency to the Gradle lock and every plugin version.
      - name: Maven build and tests from the generated pom.xml
        run: |
          mvn --version
          mvn --batch-mode --no-transfer-progress --strict-checksums -f java/build/maven-smoke/pom.xml verify

  security-scans:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TRIVY_VERSION: 0.76.1
      TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
      # semgrep/semgrep 1.181.0, multi-architecture index digest.
      SEMGREP_IMAGE: semgrep/semgrep:1.181.0@sha256:81474464c1f07483ba0682a44787fd93c91397419762a04abe2bafaae396304b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Commit under test
        run: *print-commit
      - name: Baseline gate self-test (blocking findings fail, exact acceptances suppress)
        run: python3 -B tools/security/test_baseline_gate.py
      - name: Install Trivy (checksum verified)
        run: |
          dir="${RUNNER_TEMP}/trivy"
          mkdir -p "${dir}"
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "${dir}/${archive}" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  ${dir}/${archive}" | sha256sum --check --strict
          tar -xzf "${dir}/${archive}" -C "${dir}" trivy
          echo "${dir}" >> "${GITHUB_PATH}"
      - name: Rules for Semgrep (semgrep-rules pinned by commit; Java rules only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: semgrep/semgrep-rules
          ref: 16b9e6d45f10649f6a531ec4838ed9924372c3bc
          path: .semgrep-rules
          persist-credentials: false
      # PR 7 review D-02 (3): the real scanners must report planted canaries (a lockfile pinning a library with a known
      # critical CVE, a Java file using MD5) through the same flags and the same gate, or the job fails.
      - name: Scanner self-test (planted canaries must fail the baseline gate)
        run: |
          canary="${RUNNER_TEMP}/canary"
          mkdir -p "${canary}/java"
          printf 'org.apache.logging.log4j:log4j-core:2.14.1=runtimeClasspath\nempty=\n' > "${canary}/gradle.lockfile"
          printf 'import java.security.MessageDigest;\nclass Canary {\n  byte[] d(byte[] b) throws Exception {\n    return MessageDigest.getInstance("MD5").digest(b);\n  }\n}\n' \
            > "${canary}/java/Canary.java"
          trivy fs --scanners vuln,misconfig --list-all-pkgs --format json --output "${RUNNER_TEMP}/canary-trivy.json" \
            --exit-code 0 --no-progress "${canary}"
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}/.semgrep-rules:/rules:ro" -v "${canary}:/src:ro" -v "${RUNNER_TEMP}:/out" -w /src \
            "${SEMGREP_IMAGE}" semgrep scan --config /rules/java --metrics off --disable-version-check --strict \
              --json --output /out/canary-semgrep.json java
          rc=0
          python3 -B tools/security/baseline_gate.py --trivy "${RUNNER_TEMP}/canary-trivy.json" \
            --semgrep "${RUNNER_TEMP}/canary-semgrep.json" > "${RUNNER_TEMP}/canary-gate.txt" || rc=$?
          cat "${RUNNER_TEMP}/canary-gate.txt"
          if [ "${rc}" -ne 1 ]; then echo "scanner self-test FAIL: gate exit ${rc}, expected 1"; exit 1; fi
          grep -q "BLOCKING  trivy .* CVE-2021-44228 " "${RUNNER_TEMP}/canary-gate.txt" \
            || { echo "scanner self-test FAIL: Trivy did not report the planted CVE"; exit 1; }
          grep -q "BLOCKING  semgrep .*use-of-md5" "${RUNNER_TEMP}/canary-gate.txt" \
            || { echo "scanner self-test FAIL: Semgrep did not report the planted MD5 use"; exit 1; }
          echo "scanner self-test PASS"
      # SR-SC-2: dependency vulnerabilities from the Gradle lockfiles and misconfigurations in the deploy manifests and
      # any Containerfile. Secrets are gitleaks's job. --list-all-pkgs lets the gate prove the lockfiles were parsed; the
      # report is judged by the baseline gate, not by Trivy's exit code.
      - name: Trivy filesystem, lockfile and configuration scan
        run: |
          trivy --version
          trivy fs --scanners vuln,misconfig --list-all-pkgs --format json --output "${RUNNER_TEMP}/trivy.json" \
            --exit-code 0 --no-progress --skip-dirs .semgrep-rules .
      # The scanner runs in the digest-pinned image with no network: local rules, no metrics, no version check; --strict
      # turns a skipped or unparsed file into an error the gate refuses.
      - name: Semgrep on the Java sources
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "${GITHUB_WORKSPACE}:/src:ro" -v "${RUNNER_TEMP}:/out" -w /src "${SEMGREP_IMAGE}" \
            semgrep scan --config /src/.semgrep-rules/java --metrics off --disable-version-check --strict \
              --json --output /out/semgrep.json java
      - name: Findings above security/baseline.yaml fail
        run: |
          python3 -B tools/security/baseline_gate.py \
            --trivy "${RUNNER_TEMP}/trivy.json" --semgrep "${RUNNER_TEMP}/semgrep.json"
