# rwsafe-db: rwsafe's own PostgreSQL 16 (ADR-002), never a schema in neXus's database. The sclorg arbitrary-UID image
# family neXus uses; the digest is the one neXus pins (neXus deploy/ui2/40-database-statefulset.yaml, read 2026-10-30);
# re-resolve before a release with
#   skopeo inspect --format '{{.Digest}}' docker://quay.io/sclorg/postgresql-16-c9s:<tag>
# Byte cap (ADR-002 §1, PORTS_AND_RESOURCES §4.2): the PVC `rwsafe-db-data` requests 20Gi and counts against the quota's
# requests.storage; local-path does not enforce a size (measured), so the enforcement is the application's byte caps and
# the node-disk watermark breaker (CAPACITY_AND_SLO_MODEL §2). Prompt and response bodies never live here.
# Reachable only from the control plane (60-networkpolicies.yaml). The data plane holds no database credential.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rwsafe-db-data
  namespace: rwsafe
  labels: { app.kubernetes.io/part-of: rwsafe, app.kubernetes.io/name: rwsafe-db }
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rwsafe-db
  namespace: rwsafe
  labels:
    app.kubernetes.io/part-of: rwsafe
    app.kubernetes.io/name: rwsafe-db
    app.kubernetes.io/component: database
spec:
  serviceName: rwsafe-db
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: rwsafe-db
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: rwsafe
        app.kubernetes.io/name: rwsafe-db
        app.kubernetes.io/component: database
    spec:
      serviceAccountName: rwsafe-db
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: database
          image: quay.io/sclorg/postgresql-16-c9s@sha256:fbef891ec464ee8d20332c7f9a4a68decc0b6db8460e7e875df6f33cac5003dc
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRESQL_USER
              value: rwsafe_app
            - name: POSTGRESQL_DATABASE
              value: rwsafe
            # The sclorg image reads its initial role password from the environment only; it comes from the Secret and
            # never appears in a manifest, an argument or a log (ADR-002 §1).
            - name: POSTGRESQL_PASSWORD
              valueFrom: { secretKeyRef: { name: rwsafe-db-credentials, key: spring.datasource.password } }
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          readinessProbe:
            exec:
              command: ["pg_isready", "-q", "-h", "127.0.0.1", "-p", "5432"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["pg_isready", "-q", "-h", "127.0.0.1", "-p", "5432"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            # PORTS_AND_RESOURCES §4.3 quota sum (1.5 CPU, 3Gi).
            requests: { cpu: 250m, memory: 1Gi }
            limits: { cpu: 1500m, memory: 3Gi }
          securityContext:
            runAsNonRoot: true
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            # The image writes its generated passwd entry and configuration under its home; the data directory is the
            # PVC mounted inside it (the layout neXus runs).
            - name: pgsql-home
              mountPath: /var/lib/pgsql
            - name: data
              mountPath: /var/lib/pgsql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rwsafe-db-data
        - name: pgsql-home
          emptyDir: { sizeLimit: 64Mi }
        - name: run
          emptyDir: { sizeLimit: 16Mi }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: rwsafe-db
  namespace: rwsafe
  labels: { app.kubernetes.io/part-of: rwsafe, app.kubernetes.io/name: rwsafe-db, app.kubernetes.io/component: database }
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rwsafe-db
    app.kubernetes.io/component: database
  ports:
    - { name: postgresql, port: 5432, targetPort: postgresql, protocol: TCP }
