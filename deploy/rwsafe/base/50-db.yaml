# rwsafe-db: rwsafe's own PostgreSQL 16 (ADR-002), never a schema in neXus's database. The sclorg arbitrary-UID image
# family neXus uses; the digest is the one neXus pins (neXus deploy/ui2/40-database-statefulset.yaml, read 2026-10-30);
# re-resolve before a release with
#   skopeo inspect --format '{{.Digest}}' docker://quay.io/sclorg/postgresql-16-c9s:<tag>
# Byte cap (ADR-002 §1, PORTS_AND_RESOURCES §4.2): the PVC `rwsafe-db-data` requests 20Gi and counts against the quota's
# requests.storage; local-path does not enforce a size (measured), so the enforcement is the application's byte caps and
# the node-disk watermark breaker (CAPACITY_AND_SLO_MODEL §2). Prompt and response bodies never live here.
# Reachable only from the control plane (60-networkpolicies.yaml); no egress at all, DNS included. The data plane holds no
# database credential.
# Roles (ADR-002 §1-§2, PR 18 review D-06): the image's own user is rwsafe_migrate, the database owner and Flyway's DDL
# role; db/rwsafe-roles.sh (sourced by the image on every start) adds the DML role rwsafe_app and its grants. Tuning
# (ADR-002 §7): shared_buffers through the image's POSTGRESQL_SHARED_BUFFERS, the rest in db/rwsafe-tuning.conf. Both
# files reach the image through its documented extension directories under /opt/app-root/src (sclorg postgresql-start/
# and postgresql-cfg/); UNVERIFIED (2026-10-30) on the pinned digest until the first-installation dry run shows the two
# roles and `SHOW work_mem` = 16MB (DEPLOY_AND_SHARED_HOST_RUNBOOK §4).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rwsafe-db-data
  namespace: rwsafe
  labels: { app.kubernetes.io/part-of: rwsafe, app.kubernetes.io/name: rwsafe-db }
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rwsafe-db
  namespace: rwsafe
  labels:
    app.kubernetes.io/part-of: rwsafe
    app.kubernetes.io/name: rwsafe-db
    app.kubernetes.io/component: database
spec:
  serviceName: rwsafe-db
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: rwsafe-db
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: rwsafe
        app.kubernetes.io/name: rwsafe-db
        app.kubernetes.io/component: database
    spec:
      serviceAccountName: rwsafe-db
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: database
          image: quay.io/sclorg/postgresql-16-c9s@sha256:fbef891ec464ee8d20332c7f9a4a68decc0b6db8460e7e875df6f33cac5003dc
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRESQL_USER
              value: rwsafe_migrate
            - name: POSTGRESQL_DATABASE
              value: rwsafe
            - name: POSTGRESQL_SHARED_BUFFERS
              value: 512MB
            # The sclorg image reads role passwords from the environment only; they come from the Secret and never
            # appear in a manifest, an argument or a log (ADR-002 §1). rwsafe-roles.sh unsets RWSAFE_APP_PASSWORD before
            # the server starts for good.
            - name: POSTGRESQL_PASSWORD
              valueFrom: { secretKeyRef: { name: rwsafe-db-credentials, key: rwsafe.migration.password } }
            - name: RWSAFE_APP_PASSWORD
              valueFrom: { secretKeyRef: { name: rwsafe-db-credentials, key: spring.datasource.password } }
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          readinessProbe:
            exec:
              command: ["pg_isready", "-q", "-h", "127.0.0.1", "-p", "5432"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["pg_isready", "-q", "-h", "127.0.0.1", "-p", "5432"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            # PORTS_AND_RESOURCES §4.3 quota sum (1.5 CPU, 3Gi).
            requests: { cpu: 250m, memory: 1Gi }
            limits: { cpu: 1500m, memory: 3Gi }
          securityContext:
            runAsNonRoot: true
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            # The image writes its generated passwd entry and configuration under its home; the data directory is the
            # PVC mounted inside it (the layout neXus runs).
            - name: pgsql-home
              mountPath: /var/lib/pgsql
            - name: data
              mountPath: /var/lib/pgsql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: db-start
              mountPath: /opt/app-root/src/postgresql-start
              readOnly: true
            - name: db-cfg
              mountPath: /opt/app-root/src/postgresql-cfg
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rwsafe-db-data
        - name: pgsql-home
          emptyDir: { sizeLimit: 64Mi }
        - name: run
          emptyDir: { sizeLimit: 16Mi }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        - name: db-start
          configMap:
            name: rwsafe-db-config
            defaultMode: 292   # 0444 octal: sourced, never executed
            items:
              - { key: rwsafe-roles.sh, path: rwsafe-roles.sh }
              - { key: rwsafe-roles.sql, path: rwsafe-roles.sql }
        - name: db-cfg
          configMap:
            name: rwsafe-db-config
            defaultMode: 292
            items:
              - { key: rwsafe-tuning.conf, path: rwsafe-tuning.conf }
---
apiVersion: v1
kind: Service
metadata:
  name: rwsafe-db
  namespace: rwsafe
  labels: { app.kubernetes.io/part-of: rwsafe, app.kubernetes.io/name: rwsafe-db, app.kubernetes.io/component: database }
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rwsafe-db
    app.kubernetes.io/component: database
  ports:
    - { name: postgresql, port: 5432, targetPort: postgresql, protocol: TCP }
