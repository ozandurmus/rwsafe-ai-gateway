# ADR-002 §7, included at the end of the image's generated postgresql.conf (the sclorg `postgresql-cfg/` extension
# point). shared_buffers is the image's POSTGRESQL_SHARED_BUFFERS variable (50-db.yaml).
work_mem = 16MB
# Bounded WAL: checkpoints keep pg_wal near max_wal_size; nothing retains WAL for a replica or a slot.
max_wal_size = 1GB
min_wal_size = 80MB
wal_keep_size = 0
max_slot_wal_keep_size = 0
# Slow statements are logged, never their parameter values (bodies are not in the database anyway).
log_min_duration_statement = 1000
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
