# PORTS_AND_RESOURCES §4.2, ADR-001 §5: namespace default-deny, then explicit allows between rwsafe's own workloads.
# Platform peers (DNS, Traefik, the ServiceLB pods, the metrics scraper) and the directory's addresses are named in the
# overlay because they are platform or estate facts (PORT-3). No rule names a `ui2*` namespace, and every egress rule names
# its destination. Ports are numeric (kube-router, the k3s policy controller).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rwsafe-default-deny
  namespace: rwsafe
  labels: { app.kubernetes.io/part-of: rwsafe }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# The ICAP pods reach only the control plane's snapshot feed and ingestion route (ARCH-1); no other egress (DNS in the
# overlay), no database, no internet. In-cluster ICAP comes only from the ICAP e2e Job's pods (label
# app.kubernetes.io/name: rwsafe-icap-e2e, the Job that SHIP_PIPELINE_PLAN runs after a deploy); ProxySG traffic arrives
# through the ServiceLB pods and the metrics scrape from the scraper's namespace (both in the overlay).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rwsafe-icap
  namespace: rwsafe
  labels: { app.kubernetes.io/part-of: rwsafe, app.kubernetes.io/name: rwsafe-icap }
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rwsafe-icap
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rwsafe-icap-e2e
      ports:
        - { protocol: TCP, port: 1344 }
        - { protocol: TCP, port: 11344 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rwsafe-control
      ports:
        - { protocol: TCP, port: 8091 }
        - { protocol: TCP, port: 8092 }
---
# The control plane: 8091/8092 from the ICAP pods only; out to its database. The directory (LDAP/LDAPS) egress names the
# directory's addresses, which are estate values: the overlay's `rwsafe-control-to-directory`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rwsafe-control
  namespace: rwsafe
  labels: { app.kubernetes.io/part-of: rwsafe, app.kubernetes.io/name: rwsafe-control }
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rwsafe-control
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rwsafe-icap
      ports:
        - { protocol: TCP, port: 8091 }
        - { protocol: TCP, port: 8092 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rwsafe-db
      ports:
        - { protocol: TCP, port: 5432 }
---
# The database: 5432 from the control plane only; no egress at all (the default deny holds; DNS is not granted to it).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rwsafe-db
  namespace: rwsafe
  labels: { app.kubernetes.io/part-of: rwsafe, app.kubernetes.io/name: rwsafe-db }
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rwsafe-db
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rwsafe-control
      ports:
        - { protocol: TCP, port: 5432 }
