# Committed runtime configuration: ports, in-cluster addresses and mount paths only (AGENTS.md section 8: deploy/rwsafe/
# is the single source of runtime configuration). Nothing here names a real host, address, account or key; real names
# live in the uncommitted ConfigMap `rwsafe-estate` and secrets in the Secrets named in ../contracts/runtime-contracts.json.
# Paths to key and password files are set in the pod specs next to their volume mounts, not here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rwsafe-icap-config
  namespace: rwsafe
  labels: { app.kubernetes.io/part-of: rwsafe, app.kubernetes.io/name: rwsafe-icap }
data:
  # Plain ICAP stays open only while hardening exception H-2 (pilot) is open; with Secure ICAP configured the engine
  # opens 1344 only because this value asks for it (D-09). Set to "0" when H-2 closes.
  RWSAFE_ICAP_PORT: "1344"
  RWSAFE_ICAPS_PORT: "11344"
  RWSAFE_METRICS_PORT: "9401"
  # The control plane's cluster-internal listeners (POLICY_SNAPSHOT_CONTRACT.md, LOCAL_RUN.md). With a snapshot URL set,
  # the engine is not ready until it holds a valid signed snapshot (fail closed: no built-in development policy).
  RWSAFE_SNAPSHOT_URL: "http://rwsafe-control.rwsafe.svc.cluster.local:8091/internal/v1/policy/snapshot"
  RWSAFE_CONTROL_EVENTS_URL: "http://rwsafe-control.rwsafe.svc.cluster.local:8092/internal/v1/verdict-events"
  RWSAFE_SPOOL_DIR: "/var/lib/rwsafe/spool"
  RWSAFE_SNAPSHOT_CACHE: "/var/cache/rwsafe/snapshot"
  # Group claims (PO decision Q-39, PR 20 review D-01): deliberately unset, so group claims are disabled and every
  # transaction takes the strictest of the Everyone rule and every enforce group rule. The engine never guesses the
  # encoding. Which one the estate proxy uses for X-Authenticated-Groups is UNVERIFIED (2026-10-31); once a masked
  # capture of one header shape proves it, the PO adds `RWSAFE_GROUP_CLAIM_ENCODING: "plain"` or `"base64"` here in a
  # pull request (DEPLOY_AND_SHARED_HOST_RUNBOOK §7.5), never by `kubectl set env`.
  # Redacted capture (Q-4 b): off on both sides until the capture key, the notice values and the PO's go-ahead exist
  # (runbook §7.5); `redacted` turns it on here and in rwsafe-control-config together. The bound of one event's text is
  # the engine's default, written out (at most 65536).
  RWSAFE_CAPTURE_MODE: "off"
  RWSAFE_CAPTURE_MAX_BYTES: "32768"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rwsafe-control-config
  namespace: rwsafe
  labels: { app.kubernetes.io/part-of: rwsafe, app.kubernetes.io/name: rwsafe-control }
data:
  # application.yaml binds all three listeners to loopback by default; in the pod they listen on the pod address and the
  # NetworkPolicies decide who reaches them. The control plane is ready (GET /readyz on 8080) only when all three listen.
  RWSAFE_HTTP_BIND: "0.0.0.0"
  RWSAFE_HTTP_PORT: "8080"
  RWSAFE_SNAPSHOT_FEED_BIND: "0.0.0.0"
  RWSAFE_SNAPSHOT_FEED_PORT: "8091"
  RWSAFE_CAPTURE_SINK_BIND: "0.0.0.0"
  RWSAFE_CAPTURE_SINK_PORT: "8092"
  # PORTS_AND_RESOURCES §3: GET /metrics (Prometheus text) only; the k3s overlay admits the scraper's namespace.
  RWSAFE_METRICS_BIND: "0.0.0.0"
  RWSAFE_METRICS_PORT: "9400"
  RWSAFE_DB_URL: "jdbc:postgresql://rwsafe-db.rwsafe.svc.cluster.local:5432/rwsafe"
  # ADR-002 §1-§2: the application queries as the DML role; Flyway migrates as the schema owner. Both passwords are
  # config-tree files from Secret `rwsafe-db-credentials` (spring.datasource.password, rwsafe.migration.password).
  RWSAFE_DB_USER: "rwsafe_app"
  RWSAFE_DB_MIGRATE_USER: "rwsafe_migrate"
  RWSAFE_ESTATE_DICTIONARY_FILE: "/etc/rwsafe/estate/estate-dictionary.txt"
  # Behind Traefik: forwarded headers are trusted only from RWSAFE_TRUSTED_PROXIES (from `rwsafe-estate`).
  RWSAFE_FORWARD_HEADERS: "native"
  RWSAFE_COOKIE_SECURE: "true"
  RWSAFE_BREAK_GLASS_ENABLED: "false"
  # SIEM export (LOCAL_RUN.md "SIEM export"): on/off, the destinations and the index come from the uncommitted ConfigMap
  # rwsafe-siem-destination, the CA bundle and the HEC token are mounted files (40-control.yaml). `earliest`: a new
  # destination receives everything stored (Q-SIEM-1).
  RWSAFE_SIEM_START_FROM: "earliest"
  RWSAFE_SIEM_SYSLOG_CA_FILE: "/etc/rwsafe/siem/ca.crt"
  RWSAFE_SIEM_HEC_CA_FILE: "/etc/rwsafe/siem/ca.crt"
  RWSAFE_SIEM_HEC_TOKEN_FILE: "/run/secrets/rwsafe-siem/hec-token"
  # Redacted capture (Q-4 b, ADR-009): off until the PO turns it on together with the data plane (runbook §7.5). The
  # store is the PVC rwsafe-capture-store (100Gi requested, PORTS_AND_RESOURCES §4.2); the application caps it at
  # ADR-009's MAX_STORE_BYTES, 80 GiB, written out. The key directory is the capture-key Secret, mounted whole (its
  # `<key id>.key` files, `active`, `shredded`). The watermark breaker reads the store's filesystem and /tmp (an emptyDir
  # on the kubelet's node filesystem, the one the kubelet evicts on; on k3s local-path both are the node's root
  # filesystem, where the database volume lives too).
  RWSAFE_CAPTURE_MODE: "off"
  RWSAFE_CAPTURE_STORE_DIR: "/var/lib/rwsafe/capture"
  RWSAFE_CAPTURE_MAX_STORE_BYTES: "85899345920"
  RWSAFE_CAPTURE_KEY_DIR: "/run/secrets/rwsafe-capture-key"
  RWSAFE_CAPTURE_WATERMARK_PATHS: "/tmp"
