# One ServiceAccount per workload, no token mounted (HARDENING_EXCEPTIONS "Kubernetes-level hardening"): no rwsafe pod
# talks to the Kubernetes API. No Role or RoleBinding exists.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rwsafe-icap
  namespace: rwsafe
  labels: { app.kubernetes.io/part-of: rwsafe, app.kubernetes.io/name: rwsafe-icap }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rwsafe-control
  namespace: rwsafe
  labels: { app.kubernetes.io/part-of: rwsafe, app.kubernetes.io/name: rwsafe-control }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rwsafe-db
  namespace: rwsafe
  labels: { app.kubernetes.io/part-of: rwsafe, app.kubernetes.io/name: rwsafe-db }
automountServiceAccountToken: false
