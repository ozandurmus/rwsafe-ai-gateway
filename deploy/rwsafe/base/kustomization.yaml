apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Portable workload manifests (PORT-1): Deployments, StatefulSet, Services, committed ConfigMaps, NetworkPolicies,
# PodDisruptionBudgets, ServiceAccounts (ADR-001, ADR-002). No Secret and no estate ConfigMap is ever rendered here: their
# names and keys are the contract in ../contracts/runtime-contracts.json, their values are created once by the operator
# (DEPLOY_AND_SHARED_HOST_RUNBOOK §4) and never touch a tracked file. PriorityClass names, the in-cluster registry and the
# platform's own pods (DNS, ingress, ServiceLB) are platform facts and live in the overlays (PORT-3).
resources:
  - 10-serviceaccounts.yaml
  - 20-configmaps.yaml
  - 30-dataplane.yaml
  - 40-control.yaml
  - 50-db.yaml
  - 60-networkpolicies.yaml
# The database's role script and tuning (ADR-002 §1-§2, §7), mounted into the sclorg image's extension directories. The
# name carries a content hash, so a changed script restarts the database pod.
configMapGenerator:
  - name: rwsafe-db-config
    namespace: rwsafe
    files:
      - db/rwsafe-roles.sh
      - db/rwsafe-roles.sql
      - db/rwsafe-tuning.conf
    options:
      labels: { app.kubernetes.io/part-of: rwsafe, app.kubernetes.io/name: rwsafe-db }
