# NetworkPolicies the pilot does not need: no SIEM export. Removing it leaves the SIEM's documentation-range placeholder
# CIDR out of the render. The k3s overlay's `rwsafe-control-from-traefik` stays: Traefik reaches the admin UI
# (70-admin-ingress.yaml). The directory's egress stays too, with the pilot's ports (55-pilot-directory-egress.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rwsafe-control-to-siem
  namespace: rwsafe
$patch: delete
