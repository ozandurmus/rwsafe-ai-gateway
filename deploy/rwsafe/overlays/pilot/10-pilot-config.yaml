# Pilot values of the committed runtime ConfigMaps (base/20-configmaps.yaml). Paths and switches only; no estate value.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rwsafe-control-config
  namespace: rwsafe
data:
  # The local break-glass account is the pilot's only sign-in (no directory). The control plane creates it at first
  # start with a generated password, stored as a BCrypt hash, and writes the password once, owner-only, to this file on
  # the PVC rwsafe-control-identity (BreakGlassAccounts); the root filesystem is read-only, so the base default path
  # under /var/lib/rwsafe would not be writable.
  RWSAFE_BREAK_GLASS_ENABLED: "true"
  RWSAFE_BREAK_GLASS_PASSWORD_FILE: "/var/lib/rwsafe/identity/break-glass-initial-password"
  # The committed seed (policy/kustomization.yaml), mounted at the application's default path.
  RWSAFE_POLICY_SEED_FILE: "/etc/rwsafe/policy/registry-seed.yaml"
  # Traefik in front of the admin UI (70-admin-ingress.yaml) terminates https and forwards plain http to 8080 with
  # X-Forwarded-For/-Proto/-Host. Tomcat's remote-IP valve trusts them only when the TCP peer is a pod address of the k3s
  # default cluster CIDR (10.42/16; verified on HOST-A 2026-10-31 by PILOT_RUNBOOK step 14.2, counts only), and the
  # NetworkPolicy `rwsafe-control-from-traefik` admits only Traefik's pods to 8080 from the pod network; so the login
  # throttle's client address (never stored or logged) is the one Traefik saw, and nobody else can choose it (Traefik
  # trusts no incoming forwarded header, step 14.2). On HOST-A Traefik itself sees every client as the ServiceLB's
  # pod-network address (external traffic policy `Cluster`), so the throttle counts all browsers as one client: a
  # go-live item (PO decision record Q-46, amendment 1). A port-forward connects from 127.0.0.1, which is not trusted: its headers are ignored. If HOST-A's pod
  # range differs, nothing is trusted (every Traefik client shares Traefik's address in the throttle) until this line
  # is corrected; it never trusts more. The session and CSRF cookies are Secure by configuration (RWSAFE_COOKIE_SECURE),
  # not by the request's scheme, so sign-in works over https://ui.<product>.local either way (ForwardedHeadersIntegrationTest).
  RWSAFE_FORWARD_HEADERS: "native"
  RWSAFE_TRUSTED_PROXIES: "10\\.42\\.\\d{1,3}\\.\\d{1,3}"
  # Off in the pilot (restating the committed defaults): no SIEM destination, no redacted capture.
  RWSAFE_SIEM_ENABLED: "false"
  RWSAFE_CAPTURE_MODE: "off"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rwsafe-icap-config
  namespace: rwsafe
data:
  # Plain ICAP on 1344 under H-2 (at most 30 days); no Secure ICAP listener in the pilot (no TLS Secret is mounted).
  RWSAFE_ICAP_PORT: "1344"
  RWSAFE_ICAPS_PORT: null
  # Off in the pilot (restating the committed defaults; RWSAFE_GROUP_CLAIM_ENCODING stays unset: group claims off).
  RWSAFE_CAPTURE_MODE: "off"
