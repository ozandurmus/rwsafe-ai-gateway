# Plain ICAP on 1344 only (H-2): no TLS environment, Secret, container port, Service port or NetworkPolicy port for
# Secure ICAP (11344). Secure ICAP returns with the TLS Secret when H-2 closes (k3s overlay).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rwsafe-icap
  namespace: rwsafe
spec:
  template:
    spec:
      containers:
        - name: icap
          env:
            - { name: RWSAFE_TLS_CERT, $patch: delete }
            - { name: RWSAFE_TLS_KEY, $patch: delete }
            - { name: RWSAFE_TLS_CLIENT_CA, $patch: delete }
          ports:
            - { containerPort: 11344, protocol: TCP, $patch: delete }
          volumeMounts:
            - { mountPath: /run/secrets/rwsafe-icap-tls, $patch: delete }
      volumes:
        - { name: icap-tls, $patch: delete }
---
apiVersion: v1
kind: Service
metadata:
  name: rwsafe-icap
  namespace: rwsafe
spec:
  ports:
    - { port: 11344, protocol: TCP, $patch: delete }
---
# The node's 1344 only (the LoadBalancer Service). The ProxySG allowlist is the host firewall's (H-1; PILOT_RUNBOOK.md
# step 11) and the ICAP pods' NetworkPolicy rwsafe-icap-from-proxies (35-pilot-icap-clients.yaml, step 11.5).
apiVersion: v1
kind: Service
metadata:
  name: rwsafe-icap-lb
  namespace: rwsafe
spec:
  ports:
    - { port: 11344, protocol: TCP, $patch: delete }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rwsafe-icap
  namespace: rwsafe
spec:
  # In-cluster ICAP on 1344 from the ICAP e2e Job and the synthetic probe (60-icap-probe.yaml) only.
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rwsafe-icap-e2e
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rwsafe-icap-probe
      ports:
        - { protocol: TCP, port: 1344 }
