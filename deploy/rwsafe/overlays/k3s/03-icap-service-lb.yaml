# ADR-004, DEPLOY runbook §1.1, council ARCH-5: ICAP is exposed on the node address through a LoadBalancer Service that
# k3s ServiceLB implements with its own svclb pod (the way Traefik is exposed today), so the rwsafe ICAP pods carry no
# hostPort and two of them can run during a rollout. ServiceLB MASQUERADES the source address to its own pod address
# (PLAT-F2), so the ProxySG allowlist is enforced by the host firewall (@icap_clients, HARDENING H-1) and the peer is
# identified by its client certificate on 11344; the engine and the NetworkPolicy admit the ServiceLB pods. The ICAP
# header X-Client-IP (the end user's address, set by ProxySG) is unaffected. 1344 exists only while H-2 is open.
apiVersion: v1
kind: Service
metadata:
  name: rwsafe-icap-lb
  namespace: rwsafe
  labels: { app.kubernetes.io/part-of: rwsafe, app.kubernetes.io/component: icap }
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/part-of: rwsafe
    app.kubernetes.io/component: icap
  ports:
    - name: icap
      port: 1344
      targetPort: icap
      protocol: TCP
    - name: icaps
      port: 11344
      targetPort: icaps
      protocol: TCP
