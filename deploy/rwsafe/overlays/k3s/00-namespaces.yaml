# ADR-001 §3: the three rwsafe namespaces with Pod Security Admission `restricted` enforced. Label value is `rwsafe`,
# never `nexus-ui2`, so no selector written for neXus matches these pods.
apiVersion: v1
kind: Namespace
metadata:
  name: rwsafe
  labels:
    app.kubernetes.io/part-of: rwsafe
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: rwsafe-build
  labels:
    app.kubernetes.io/part-of: rwsafe
    app.kubernetes.io/component: image-build
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: rwsafe-security
  labels:
    app.kubernetes.io/part-of: rwsafe
    app.kubernetes.io/component: security-scan
    pod-security.kubernetes.io/enforce: restricted
