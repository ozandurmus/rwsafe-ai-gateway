# k3s platform peers (PORT-3): CoreDNS, Traefik and the ServiceLB (klipper-lb) pods all run in kube-system. Labels are the
# k3s defaults; UNVERIFIED on HOST-A for the ServiceLB labels (2026-10-30): verify with a masked label listing of the
# svclb pods (`tools/hosta/inventory_readonly.sh`, shapes only) before the first apply.
# DNS only for the pods that resolve a name (the ICAP pods resolve the control plane's Service, the control plane its
# database and the directory); the database gets none (PR 18 review D-03).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rwsafe-allow-dns
  namespace: rwsafe
  labels: { app.kubernetes.io/part-of: rwsafe }
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [rwsafe-icap, rwsafe-control] }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# PLAT-F2: ServiceLB masquerades the ProxySG's address to its own pod address, so the engine admits the ServiceLB pods of
# `rwsafe-icap-lb` only; the ProxySG allowlist is the host firewall's (H-1) and the peer's identity its client certificate.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rwsafe-icap-from-servicelb
  namespace: rwsafe
  labels: { app.kubernetes.io/part-of: rwsafe, app.kubernetes.io/name: rwsafe-icap }
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rwsafe-icap
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              svccontroller.k3s.cattle.io/svcname: rwsafe-icap-lb
              svccontroller.k3s.cattle.io/svcnamespace: rwsafe
      ports:
        - { protocol: TCP, port: 1344 }
        - { protocol: TCP, port: 11344 }
---
# ADR-003: the admin UI and API are reached through Traefik by host name only. The label is the k3s Traefik chart's
# default; UNVERIFIED on HOST-A (2026-10-31): verify with a masked label listing of the Traefik pods
# (`tools/hosta/inventory_readonly.sh`, shapes only) before the pilot's ingress phase (PILOT_RUNBOOK.md step 14). A
# wrong label admits nothing: the admin UI then answers Traefik's 502/504, never an open port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rwsafe-control-from-traefik
  namespace: rwsafe
  labels: { app.kubernetes.io/part-of: rwsafe, app.kubernetes.io/name: rwsafe-control }
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rwsafe-control
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - { protocol: TCP, port: 8080 }
---
# PORTS_AND_RESOURCES §3: the ICAP pods' metrics port (9401) from the metrics scraper only. Which namespace scrapes on
# HOST-A is UNVERIFIED (2026-10-30); the rule admits a namespace that carries the label below, which no namespace carries
# until the PO labels the scraper's (a change outside rwsafe's namespaces, asked of the PO first, AGENTS.md section 8), so
# until then nothing is admitted; the scraper's pods must carry the same label. The same listener holds the preStop drain
# (/admin/drain): an admitted scraper pod could drain an ICAP pod. That residual is accepted (PR 27 review Q-1: 9402 is
# the gateway's port, so the drain gets no port of its own; CURRENT_STATE.md, runbook §7.5), and is why nothing else is
# admitted to this port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rwsafe-icap-metrics-from-scraper
  namespace: rwsafe
  labels: { app.kubernetes.io/part-of: rwsafe, app.kubernetes.io/name: rwsafe-icap }
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rwsafe-icap
  policyTypes: [Ingress]
  ingress:
    - from:
        # PR 27 review D-02: the scraper's namespace AND the scraper's pods (one peer, both selectors), never every pod
        # of a labelled namespace.
        - namespaceSelector:
            matchLabels:
              rwsafe.io/metrics-scraper: "true"
          podSelector:
            matchLabels:
              rwsafe.io/metrics-scraper: "true"
      ports:
        - { protocol: TCP, port: 9401 }
---
# The directory (LDAP/LDAPS, Q-9) by address only (PR 18 review D-03). The committed CIDR is an RFC 5737 documentation
# placeholder that reaches nothing; the deploy's transient estate patch (DEPLOY_AND_SHARED_HOST_RUNBOOK §2, from
# `rwsafe-estate`) replaces it with the directory's addresses in memory, and `manifest_check.py --release` refuses a
# render that still holds a documentation range.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rwsafe-control-to-directory
  namespace: rwsafe
  labels: { app.kubernetes.io/part-of: rwsafe, app.kubernetes.io/name: rwsafe-control }
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rwsafe-control
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 192.0.2.0/24
      ports:
        - { protocol: TCP, port: 636 }
        - { protocol: TCP, port: 389 }
---
# The SIEM receivers (syslog over TLS and Splunk HEC over HTTPS, LOCAL_RUN.md "SIEM export") by address only, like the
# directory. The committed CIDR is a second RFC 5737 documentation placeholder (198.51.100.0/24, distinct from the
# directory's so each estate value replaces exactly one rule) that reaches nothing; the deploy's transient estate patch
# (DEPLOY_AND_SHARED_HOST_RUNBOOK §2, §7.4) replaces it in memory with `siem-cidr` from `rwsafe-siem-destination`, and
# `manifest_check.py --release` refuses a render that still holds a documentation range. Ports: 6514 (RFC 5425
# syslog-TLS, the exporter's default) and 8088 (Splunk HEC's default); a receiver on another port is a committed change
# here (a port is not an estate name). No UDP and no plain TCP exist (SR-SIEM-3).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rwsafe-control-to-siem
  namespace: rwsafe
  labels: { app.kubernetes.io/part-of: rwsafe, app.kubernetes.io/name: rwsafe-control }
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rwsafe-control
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 198.51.100.0/24
      ports:
        - { protocol: TCP, port: 6514 }
        - { protocol: TCP, port: 8088 }
---
# PORTS_AND_RESOURCES §3: the control plane's metrics port (9400, GET /metrics only) from the metrics scraper only, by
# the same namespace and pod labels as the ICAP pods' 9401 (nothing carries them until the PO labels the scraper's
# namespace and pods, so until then nothing is admitted). Nothing else answers on 9400.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rwsafe-control-metrics-from-scraper
  namespace: rwsafe
  labels: { app.kubernetes.io/part-of: rwsafe, app.kubernetes.io/name: rwsafe-control }
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rwsafe-control
  policyTypes: [Ingress]
  ingress:
    - from:
        # PR 27 review D-02: the scraper's namespace AND the scraper's pods (one peer, both selectors), never every pod
        # of a labelled namespace.
        - namespaceSelector:
            matchLabels:
              rwsafe.io/metrics-scraper: "true"
          podSelector:
            matchLabels:
              rwsafe.io/metrics-scraper: "true"
      ports:
        - { protocol: TCP, port: 9400 }
